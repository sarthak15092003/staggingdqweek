name: Deploy Quanto Theme via FTP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Fast Parallel FTP Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy Theme via LFTP (Parallel 10x Speed)
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set net:timeout 15;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror --reverse --parallel=10 --ignore-time --verbose ./quanto wp-content/themes/quanto;
            quit;
          "
